<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Login - Smart Crop Care AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>🌱 Smart Crop Care AI</h1>

    <h2>👨‍🌾 Farmer Login</h2>

    <p>Login to access your Smart Farming Dashboard</p>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter Email Address"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <br><br>

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
        <a href="/signup">Create Account</a>
    </p>

    <p>
        <a href="/">← Back to Home</a>
    </p>

</div>

</body>

</html>
